name: Release LuaSkill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # standard: one package for every system. platform: one package per system plus a package index.
  # Set the repository variable LUASKILLS_PACKAGE_LAYOUT to switch without editing this file.
  LUASKILLS_PACKAGE_LAYOUT: ${{ vars.LUASKILLS_PACKAGE_LAYOUT || '{{LAYOUT}}' }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate and package the skill
        id: package
        uses: LuaSkills/luaskills-debug@v{{DEBUG_VERSION}}
        with:
          layout: ${{ env.LUASKILLS_PACKAGE_LAYOUT }}
          expect-tag: ${{ github.ref_name }}

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ steps.package.outputs.out-dir }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$OUT_DIR"/*
