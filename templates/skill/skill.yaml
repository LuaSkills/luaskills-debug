name: {{SKILL_NAME}}
version: 0.1.0
enable: true
debug: false
registration:
  mode: explicit
  default_locale: en-US
  locales:
    en-US: {title: Hello, description: Returns a greeting.}
  prompt_skills:
    - name: hello-workflow
      file: skills/hello-workflow/SKILL.md
      locales:
        en-US: {title: Hello workflow, description: Use the starter greeting tool.}
entries:
  - name: hello
    description: Return one greeting; replace it with your first real tool.
    lua_entry: runtime/hello.lua
    lua_module: hello
    parameters:
      - name: name
        type: string
        description: Optional name greeted by the tool.
        required: false
