[package]
name = "luaskills-debug"
# Major and minor follow the LuaSkills runtime this tool embeds; the patch number moves on its own.
# 主次版本跟随本工具内嵌的 LuaSkills 运行时；补丁号独立递增。
version = "0.8.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Standalone LuaSkills debugger and packager: run skill tools with a SQLite host, validate skill sources and build release packages."
repository = "https://github.com/LuaSkills/luaskills-debug"
homepage = "https://github.com/LuaSkills/luaskills-debug"
readme = "README.md"
publish = false

[[bin]]
name = "luaskills-debug"
path = "src/main.rs"

[dependencies]
# The exact published runtime; local development overrides it through an untracked .cargo/config.toml patch.
# 精确的已发布运行时；本地开发通过未跟踪的 .cargo/config.toml patch 覆盖。
luaskills = "=0.8.0"
# The debugger is a database-providing host, so it links SQLite with authorizer hooks.
# 调试工具是提供数据库的宿主，因此链接带授权钩子的 SQLite。
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML reader for skill manifests, matching the runtime.
# 读取技能清单的 YAML 解析器，与运行时保持一致。
serde_norway = "0.9.42"

[profile.release]
lto = "thin"
codegen-units = 1
