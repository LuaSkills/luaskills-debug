name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - name: Preserve exact tracked source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy, rustfmt
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Verify formatting
        shell: pwsh
        run: cargo fmt --all -- --check
      - name: Verify lints
        shell: pwsh
        run: cargo clippy --all-targets -j 4 -- -D warnings
      - name: Run tests
        shell: pwsh
        run: cargo test -j 4 -- --test-threads=1
      - name: Run release helper regressions
        shell: pwsh
        run: |
          python -X utf8 -m unittest discover -s scripts/release -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Release helper regressions failed" }
      # The shipped fetcher must run on the Bash 3.2 that macOS installs as /bin/bash.
      # 随包发布的获取脚本必须能在 macOS 自带的 /bin/bash（Bash 3.2）上运行。
      - name: Fetch the Lua runtime with the system Bash
        if: runner.os == 'macOS'
        run: RUNTIME_ROOT="$RUNNER_TEMP/lua-runtime" /bin/bash ./scripts/deps/fetch_deps.sh lua

  # The managed Python/Node smoke downloads exact runtimes, so it runs only on request.
  # 受管 Python/Node 冒烟会下载精确版本运行时，因此仅在手动请求时运行。
  managed-runtime-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Run managed-runtime smoke
        run: bash ./scripts/runtime/managed_runtime_smoke.sh
